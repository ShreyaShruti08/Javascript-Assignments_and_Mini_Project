
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Inventory Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Product Inventory & Analytics</h1>
    <p>Manage products. Track value. Analyze inventory.</p>
  </header>

  <main>
    <section class="form-card">
      <h2>Add New Product</h2>
      <form id="productForm">
        <input id="productName" placeholder="Product name" required>
        <input id="productPrice" type="number" min="0.01"
          step="0.01" placeholder="Price ($)" required>
        <button type="submit">+ Add Product</button>
      </form>
      <p id="message"></p>
    </section>

    <section class="stats">
      <div class="card"><span>Total Products</span><h2 id="count">3</h2></div>
      <div class="card"><span>Inventory Value</span><h2 id="total">$975.00</h2></div>
      <div class="card"><span>Affordable Items</span><h2 id="affordable">2</h2></div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <h2>Inventory</h2>
        <select id="filter">
          <option value="all">All Products</option>
          <option value="affordable">Under $200</option>
          <option value="premium">Premium</option>
          <option value="budget">Budget</option>
          <option value="standard">Standard</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Product</th><th>Price</th><th>Category</th></tr>
          </thead>
          <tbody id="inventory"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Inventory Report</h2>
      <pre id="report"></pre>
      <button id="reportBtn">Generate Report</button>
    </section>
  </main>

  <footer>JavaScript Capstone Project · Product Inventory System</footer>
  <script src="script.js"></script>
</body>
</html>
